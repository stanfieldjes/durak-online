<section class="panel panel--account" data-route="account" hidden>
  <h1 class="display">You</h1>

  <div class="account">
    <div class="account__face">
      <span id="account-avatar"></span>
      <div class="account__face-actions">
        <label class="btn" for="avatar-file">Choose a picture</label>
        <input type="file" id="avatar-file" accept="image/png,image/jpeg,image/webp,image/gif"
               class="sr-only">
        <button type="button" class="btn btn--quiet" id="avatar-remove" hidden>Remove</button>
      </div>
    </div>

    <form class="account__name" id="account-name-form" novalidate>
      <label class="field" for="account-name-input">
        <span>Name at the table</span>
      </label>
      <div class="account__name-row">
        <input type="text" id="account-name-input" name="name" autocomplete="nickname"
               maxlength="40" placeholder="3-20 characters">
        <button type="submit" class="btn btn--primary" id="account-name-save">Save</button>
      </div>
    </form>
  </div>

  <p class="account__note" id="account-note" role="status" hidden></p>

  <section class="rating-panel">
    <header class="rating-panel__head">
      <div class="rating-panel__figure">
        <span class="rating-panel__label">Rating</span>
        <span class="rating-panel__value" id="account-rating">—</span>
      </div>
      <p class="rating-panel__meta">
        <span id="account-games"></span>
      </p>
    </header>
    <div id="account-chart"></div>
  </section>
</section>
