<section class="panel panel--lobby" data-route="lobby" hidden>
  <div class="lobby__tables">
    <h2 class="heading">Tables</h2>
    <ul class="tables" id="open-games"></ul>
    <div class="lobby__buttons">
      <button type="button" class="btn btn--primary" id="create-game">Open a table</button>
    </div>
  </div>

  <div class="lobby__history">
    <h2 class="heading">History</h2>
    <ul class="history" id="recent-games"></ul>
    <p class="empty" id="no-history" hidden>None</p>

    <nav class="pager" id="recent-pager" aria-label="Recent games" hidden>
      <button type="button" class="btn btn--quiet" id="recent-prev">&lsaquo; Newer</button>
      <span class="pager__count" id="recent-page" aria-live="polite"></span>
      <button type="button" class="btn btn--quiet" id="recent-next">Older &rsaquo;</button>
    </nav>
  </div>
</section>
