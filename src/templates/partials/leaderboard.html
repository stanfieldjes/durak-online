<section class="panel panel--ranks" data-route="leaderboard" hidden>
  <h1 class="display">Ranks</h1>
  <p class="lede">Everyone starts at 100. Beating a stronger table moves you further than beating a weaker one, and the durak rate is the share of games you ended up holding the cards.</p>
  <table class="ranks">
    <thead>
      <tr>
        <th scope="col">Player</th>
        <th scope="col">Rating</th>
        <th scope="col">Durak</th>
      </tr>
    </thead>
    <tbody id="ranks-body"></tbody>
  </table>
  <p class="empty" id="no-ranks" hidden>No finished games yet.</p>
</section>
