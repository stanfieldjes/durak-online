<section class="panel panel--ranks" data-route="leaderboard" hidden>
  <h1 class="display">Leaderboard</h1>
  <table class="ranks">
    <thead>
      <tr>
        <th scope="col" class="ranks__place">#</th>
        <th scope="col">Player</th>
        <th scope="col">Games</th>
        <th scope="col">Durak</th>
        <th scope="col">Expected</th>
        <th scope="col">
          <span class="th-info">
            Score
            <button type="button" class="info" aria-describedby="score-tip">
              <span aria-hidden="true">i</span>
              <span class="sr-only">Score Calculation</span>
            </button>
            <span class="tip" id="score-tip" role="tooltip">
              score = (expected durak rate &minus; actual durak rate) &times; 100
            </span>
          </span>
        </th>
      </tr>
    </thead>
    <tbody id="ranks-body"></tbody>
  </table>
 
  <p class="empty" id="no-ranks" hidden>No finished games yet.</p>
</section>
