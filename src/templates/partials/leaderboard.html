<section class="panel panel--ranks" data-route="leaderboard" hidden>
  <h1 class="display">Leaderboard</h1>
  <table class="ranks">
    <thead>
      <tr>
        <th scope="col" class="ranks__place">#</th>
        <th scope="col">Player</th>
        <th scope="col">Games</th>
        <th scope="col">Rating</th>
      </tr>
    </thead>
    <tbody id="ranks-body"></tbody>
  </table>

  <p class="empty" id="no-ranks" hidden>No finished games yet.</p>
</section>
